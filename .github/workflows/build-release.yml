name: Build, Sign & Release

# Triggers on a version tag push (v1.2.3) or manually for an existing tag.
#
# Required repository secrets:
#   HOMEBREW_TAP_TOKEN                                    Personal access token with write access to the tap repo
# Optional (needs a paid Apple Developer account; without them the app is ad-hoc signed, not notarized):
#   DEVELOPER_ID_CERT_P12 / DEVELOPER_ID_CERT_PASSWORD  Developer ID Application certificate (.p12, base64) + password
#   ASC_API_KEY / ASC_API_KEY_ID / ASC_API_ISSUER_ID      App Store Connect API key (.p8, base64) for notarization
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v1.0.0)'
        required: true

# Creating the GitHub Release needs write access to repository contents.
permissions:
  contents: write

env:
  APP_NAME: SimpleShot
  BUNDLE_ID: com.zkmn73.simpleshot
  # Personal Homebrew tap that hosts the cask (repo "homebrew-tap" => tap name `zkmn73/tap`).
  TAP_REPO: zkmn73/homebrew-tap
  CASK_TOKEN: simpleshot

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      # With a Developer ID certificate secret the app is signed and notarized.
      # Without one it is ad-hoc signed and the Homebrew cask strips the quarantine flag.
      HAS_SIGNING: ${{ secrets.DEVELOPER_ID_CERT_P12 != '' }}

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Select Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XC" ]; then XC=$(ls -d /Applications/Xcode*.app | sort -V | tail -1); fi
          echo "Using $XC"
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version

      # ── 2. Parse version from tag ──────────────────────────────────────────
      - name: Set version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "VERSION=${TAG#v}" >> $GITHUB_ENV
          echo "BUILD_NUMBER=${{ github.run_number }}" >> $GITHUB_ENV

      # ── 3. Import Developer ID certificate into a temporary keychain ───────
      - name: Import signing certificate
        if: env.HAS_SIGNING == 'true'
        env:
          CERT_P12_BASE64:  ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          CERT_PASSWORD:    ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          echo "$CERT_P12_BASE64" | base64 --decode > /tmp/cert.p12

          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASS="$(openssl rand -hex 16)"

          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 3600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"

          security import /tmp/cert.p12 \
            -k "$KEYCHAIN_PATH" \
            -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/productbuild

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"

          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH"     >> $GITHUB_ENV
          echo "KEYCHAIN_PASS=$KEYCHAIN_PASS"     >> $GITHUB_ENV

          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | grep "Developer ID Application" \
            | sed -E 's/.*"(.+)"/\1/' | head -1)
          echo "SIGNING_IDENTITY=$IDENTITY"       >> $GITHUB_ENV

          rm /tmp/cert.p12

      # ── 4. Resolve SPM packages + Build ───────────────────────────────────
      - name: Build app
        run: |
          xcodebuild \
            -project macshot.xcodeproj \
            -scheme macshot \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            -resolvePackageDependencies

          xcodebuild \
            -project macshot.xcodeproj \
            -scheme macshot \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            build

          test -d "build/Build/Products/Release/$APP_NAME.app"

      # ── 5a. Ad-hoc sign (no Apple Developer account) ──────────────────────
      - name: Sign app (ad-hoc)
        if: env.HAS_SIGNING != 'true'
        run: |
          APP="build/Build/Products/Release/$APP_NAME.app"
          codesign --force --deep --sign - \
            --entitlements macshot/macshot.entitlements \
            "$APP"
          codesign --verify --deep --strict "$APP"
          echo "✅ Ad-hoc signed: $APP"

      # ── 5b. Sign the .app with Developer ID ───────────────────────────────
      - name: Sign app (Developer ID)
        if: env.HAS_SIGNING == 'true'
        run: |
          APP="build/Build/Products/Release/$APP_NAME.app"

          # Sign any embedded code first (innermost to outermost), then the app itself.
          find "$APP/Contents" \( -name "*.dylib" -o -name "*.framework" \) -print0 | while IFS= read -r -d '' f; do
            echo "Signing: $f"
            codesign --force --options runtime \
              --sign "$SIGNING_IDENTITY" \
              --keychain "$KEYCHAIN_PATH" "$f"
          done

          codesign --force --options runtime \
            --sign "$SIGNING_IDENTITY" \
            --keychain "$KEYCHAIN_PATH" \
            --entitlements macshot/macshot.entitlements \
            "$APP"

          codesign --verify --deep --strict "$APP"
          echo "✅ Signing verified: $APP"

      # ── 6. Package into a DMG ──────────────────────────────────────────────
      - name: Package DMG
        run: |
          brew install create-dmg

          STAGING="/tmp/dmg-staging"
          rm -rf "$STAGING"
          mkdir -p "$STAGING"
          cp -R "build/Build/Products/Release/$APP_NAME.app" "$STAGING/"

          # create-dmg returns exit code 2 if it can't set the volume icon
          # (no .icns at the root), which is fine — the app icon shows up anyway.
          create-dmg \
            --volname "$APP_NAME" \
            --background "assets/dmg-background.png" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "$APP_NAME.app" 150 185 \
            --app-drop-link 450 185 \
            --no-internet-enable \
            --hide-extension "$APP_NAME.app" \
            "$APP_NAME.dmg" \
            "$STAGING" \
            || [ $? -eq 2 ]

      # ── 7. Notarize ────────────────────────────────────────────────────────
      - name: Notarize
        if: env.HAS_SIGNING == 'true'
        env:
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY }}
          ASC_API_KEY_ID:     ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID:  ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_API_KEY_BASE64" | base64 --decode \
            > ~/.appstoreconnect/private_keys/AuthKey_${ASC_API_KEY_ID}.p8

          xcrun notarytool submit "$APP_NAME.dmg" \
            --key ~/.appstoreconnect/private_keys/AuthKey_${ASC_API_KEY_ID}.p8 \
            --key-id "$ASC_API_KEY_ID" \
            --issuer "$ASC_API_ISSUER_ID" \
            --wait \
            --timeout 20m

          xcrun stapler staple "$APP_NAME.dmg"
          echo "✅ Notarization complete"

          rm -f ~/.appstoreconnect/private_keys/AuthKey_${ASC_API_KEY_ID}.p8

      # ── 8. SHA256 for Homebrew ─────────────────────────────────────────────
      - name: Compute SHA256
        run: |
          SHA256=$(shasum -a 256 "$APP_NAME.dmg" | awk '{print $1}')
          echo "SHA256=$SHA256" >> $GITHUB_ENV
          echo "SHA256: $SHA256"

      # ── 9. Release notes from CHANGELOG.md (falls back to generated notes) ─
      - name: Extract release notes
        run: |
          awk "/^## \[$VERSION\]/{found=1; next} found && /^## \[/{exit} found{print}" \
            CHANGELOG.md > release_notes.md
          cat release_notes.md

      # ── 10. Create GitHub Release ──────────────────────────────────────────
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -s release_notes.md ]; then
            NOTES_FLAG="--notes-file release_notes.md"
          else
            NOTES_FLAG="--generate-notes"
          fi
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" "$APP_NAME.dmg" --clobber
          else
            gh release create "v$VERSION" "$APP_NAME.dmg" \
              --title "v$VERSION" \
              $NOTES_FLAG
          fi

      # ── 11. Update the Homebrew cask in the personal tap ───────────────────
      - name: Update Homebrew tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${TAP_REPO}.git" /tmp/tap
          mkdir -p /tmp/tap/Casks

          # Unsigned builds are quarantined by Gatekeeper; strip the flag on install.
          POSTFLIGHT=""
          if [ "$HAS_SIGNING" != "true" ]; then
            POSTFLIGHT=$(cat <<'RUBY'

            postflight do
              system_command "/usr/bin/xattr",
                             args: ["-dr", "com.apple.quarantine", "#{appdir}/SimpleShot.app"]
            end

            caveats "This build is not notarized. Screen Recording permission must be granted again after each upgrade."
          RUBY
            )
          fi

          cat > "/tmp/tap/Casks/${CASK_TOKEN}.rb" <<EOF
          cask "${CASK_TOKEN}" do
            version "${VERSION}"
            sha256 "${SHA256}"

            url "https://github.com/${GITHUB_REPOSITORY}/releases/download/v#{version}/${APP_NAME}.dmg"
            name "${APP_NAME}"
            desc "Minimal native macOS screenshot and annotation tool"
            homepage "https://github.com/${GITHUB_REPOSITORY}"

            livecheck do
              url :url
              strategy :github_latest
            end

            depends_on macos: :monterey

            app "${APP_NAME}.app"
          ${POSTFLIGHT}
            uninstall quit: "${BUNDLE_ID}"

            zap trash: [
              "~/Library/Application Scripts/${BUNDLE_ID}",
              "~/Library/Containers/${BUNDLE_ID}",
              "~/Library/Preferences/${BUNDLE_ID}.plist",
            ]
          end
          EOF

          cd /tmp/tap
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "Casks/${CASK_TOKEN}.rb"
          git diff --cached --quiet && echo "No Homebrew changes" || {
            git commit -m "${CASK_TOKEN} ${VERSION}"
            git push
          }

      # ── 12. Cleanup keychain ───────────────────────────────────────────────
      - name: Cleanup keychain
        if: always() && env.HAS_SIGNING == 'true'
        run: |
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
